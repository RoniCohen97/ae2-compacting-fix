modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/RoniCohen97/ae2-compacting-fix/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/RoniCohen97/ae2-compacting-fix"
logoFile="logo.png"
authors="${mod_authors}"
description='''
Makes AE2 autocrafting aware that the tiers of a compacting drawer (nuggets, ingots, blocks...) share one stock.
Crafting plans no longer count the same items twice, so jobs stop failing at launch with missing ingredients.
Supports Storage Drawers and Functional Storage.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="${ae2_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="storagedrawers"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="functionalstorage"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
