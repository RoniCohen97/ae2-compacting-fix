plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { url = "https://maven.blamejared.com" } // JEI
}

base {
    archivesName = mod_id
}

// Minecraft 26.1 runs on Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }

        // Runs DevSelfTest on a copy of a test world placed in run-selftest/world, then stops
        selfTest {
            server()
            gameDirectory = project.file('run-selftest')
            programArgument '--nogui'
            systemProperty 'ae2compactingfix.selfTest', project.findProperty('selfTestPos') ?: '18,-60,45'
            systemProperty 'ae2compactingfix.selfTestDrawer', project.findProperty('selfTestDrawer') ?: '18,-60,47'
            systemProperty 'ae2compactingfix.selfTestDrawerMod', project.findProperty('selfTestDrawerMod') ?: 'functionalstorage'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' is for mods we only want in the dev environment (not published as dependencies)
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // AE2: the mod we patch. Compiled against, and present in the dev environment.
    implementation("maven.modrinth:ae2:${ae2_version}")
    localRuntime("maven.modrinth:guideme:${guideme_version}")

    // Drawer mods: optional at runtime, only their classes are needed to compile the compat code
    compileOnly("maven.modrinth:storagedrawers:${storagedrawers_version}")
    localRuntime("maven.modrinth:storagedrawers:${storagedrawers_version}")
    compileOnly("maven.modrinth:functional-storage:${functionalstorage_version}")
    compileOnly("maven.modrinth:titanium:${titanium_version}") // types of Functional Storage's handlers
    localRuntime("maven.modrinth:functional-storage:${functionalstorage_version}")
    localRuntime("maven.modrinth:titanium:${titanium_version}")

    // Sophisticated Storage: nothing to patch (its compacting upgrade really crafts), here only for testing
    localRuntime("maven.modrinth:sophisticated-storage:${sophisticatedstorage_version}")
    localRuntime("maven.modrinth:sophisticated-core:${sophisticatedcore_version}")

    // JEI: only to find items more easily while testing
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
}

// Fills the ${...} placeholders of src/main/templates (neoforge.mods.toml)
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            ae2_version_range      : ae2_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Publishing to CurseForge and Modrinth: ./gradlew publishMods
// Needs CURSEFORGE_TOKEN / MODRINTH_TOKEN in the environment and the projects' ids in gradle.properties; without a
// token it only does a dry run (checks everything, uploads nothing). The changelog is this version's section of
// CHANGELOG.md.
def changelogSection = {
    def lines = file('CHANGELOG.md').readLines()
    int start = lines.findIndexOf { it == "## ${mod_version}" }
    if (start < 0)
        return "Version ${mod_version}"
    int end = lines.findIndexOf(start + 1) { it.startsWith('## ') }
    return lines.subList(start + 1, end < 0 ? lines.size() : end).join('\n').trim()
}

publishMods {
    file = jar.archiveFile
    displayName = "${mod_name} ${mod_version}"
    version = mod_version
    changelog = changelogSection()
    type = mod_version.contains('alpha') ? ALPHA : mod_version.contains('beta') ? BETA : STABLE
    modLoaders.add('neoforge')
    // A real upload only with both tokens
    def tokens = ['CURSEFORGE_TOKEN', 'MODRINTH_TOKEN'].every { providers.environmentVariable(it).getOrNull() != null }
    dryRun = !tokens

    curseforge {
        projectId = providers.gradleProperty('curseforge_project_id')
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_25)
        serverRequired = true
        requires('applied-energistics-2')
        optional('storage-drawers', 'functional-storage')
    }

    modrinth {
        projectId = providers.gradleProperty('modrinth_project_id')
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
        requires('ae2')
        optional('storagedrawers', 'functional-storage')
    }
}
